<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="S/A Scanner">
<title>Bitget S/A Scanner</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0b0d12;--p:#131722;--p2:#191e2b;--t:#f4f6fb;--m:#9aa4b2;--l:#252b3a;--g:#3ddc97;--w:#f5b942;--r:#ff6b6b;--b:#70a7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 12px calc(20px + env(safe-area-inset-bottom))}header{position:sticky;top:0;z-index:20;background:rgba(11,13,18,.94);backdrop-filter:blur(12px);padding:12px 0 10px}h1{font-size:19px;margin:0 0 4px}.sub,.hint,.statusbar{color:var(--m);font-size:11px}.settings{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.field{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:7px}.field label{font-size:10px;color:var(--m);display:block}.field input{width:100%;border:0;background:transparent;color:var(--t);font-size:14px;outline:none}.actions{display:flex;gap:8px;margin-top:8px}button{flex:1;border:0;border-radius:11px;padding:11px;font-weight:700}.scan{background:var(--b);color:#07111f}.auto{background:var(--p2);color:var(--t);border:1px solid var(--l)}.statusbar{display:flex;justify-content:space-between;margin:10px 2px 4px}.card{background:var(--p);border:1px solid var(--l);border-radius:15px;margin:9px 0;padding:13px}.top{display:flex;align-items:center;gap:8px}.rank{font-size:11px;color:var(--m);width:18px}.sym{font-size:18px;font-weight:800;flex:1}.badge{font-size:12px;font-weight:800;padding:5px 8px;border-radius:8px;background:var(--p2)}.gS{color:#71f7b8}.gA{color:#88b4ff}.gB{color:#f5c15a}.gP{color:#8b95a3}.L{color:var(--g)}.S{color:#ff7777}.state{margin-top:8px;font-size:12px;font-weight:800}.triggered{color:var(--g)}.watch{color:var(--w)}.wait{color:#8ab4ff}.weak,.invalid{color:var(--r)}.pass{color:var(--m)}.pr{display:flex;justify-content:space-between;align-items:end;margin-top:10px}.price{font-size:24px;font-weight:800}.score{font-size:12px;color:var(--m);text-align:right}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.box{background:var(--p2);border-radius:9px;padding:7px;text-align:center}.box span{display:block;font-size:9px;color:var(--m)}.box b{font-size:12px}.more{display:none;margin-top:9px;padding-top:9px;border-top:1px solid var(--l);font-size:12px;line-height:1.7}.card.open .more{display:block}.empty{text-align:center;color:var(--m);padding:50px 10px}@media(max-width:430px){.settings{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><header><h1>Bitget S/A Scanner</h1><div class="sub">BTC · ETH · SOL · XRP · PEPE · XLM / 15m · 1H · 4H · 1D</div><div class="settings"><div class="field"><label>Account $</label><input id="account" type="number" value="1000"></div><div class="field"><label>Risk %</label><input id="risk" type="number" value="1" step=".1"></div><div class="field"><label>Leverage</label><input id="lev" type="number" value="10"></div><div class="field"><label>Max Margin %</label><input id="margin" type="number" value="35"></div></div><div class="actions"><button class="scan" id="scan">SCAN NOW</button><button class="auto" id="auto">AUTO: ON</button></div><div class="statusbar"><span id="apiStatus">Ready</span><span id="updated">—</span></div></header><div id="list"><div class="empty">Scan을 시작합니다…</div></div><div class="hint">Grade = 셋업 품질 · Status = 실제 진입 타이밍. 카드 탭 → 상세보기.</div></div>
<script>
const BASE='https://api.bitget.com',SYMS=['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','PEPEUSDT','XLMUSDT'],TFS=['15m','1H','4H','1D'],W={'15m':1,'1H':2,'4H':3,'1D':2};let auto=true,busy=false;const $=id=>document.getElementById(id);
function ema(v,p){let a=2/(p+1),o=[v[0]];for(let i=1;i<v.length;i++)o.push(v[i]*a+o[i-1]*(1-a));return o}function rsi(v,p=14){if(v.length<=p)return 50;let g=0,l=0;for(let i=1;i<=p;i++){let d=v[i]-v[i-1];d>=0?g+=d:l-=d}g/=p;l/=p;for(let i=p+1;i<v.length;i++){let d=v[i]-v[i-1];g=(g*(p-1)+Math.max(d,0))/p;l=(l*(p-1)+Math.max(-d,0))/p}return l===0?100:100-100/(1+g/l)}function atr(r,p=14){let t=[];for(let i=1;i<r.length;i++)t.push(Math.max(r[i].high-r[i].low,Math.abs(r[i].high-r[i-1].close),Math.abs(r[i].low-r[i-1].close)));if(!t.length)return 0;let n=Math.min(p,t.length),a=t.slice(0,n).reduce((x,y)=>x+y,0)/n;for(let i=n;i<t.length;i++)a=(a*(p-1)+t[i])/p;return a}function mh(v){let a=ema(v,12),b=ema(v,26),m=v.map((_,i)=>a[i]-b[i]),s=ema(m,9);return m.at(-1)-s.at(-1)}function vr(r){if(r.length<21)return 1;let a=r.slice(-21,-1).reduce((s,x)=>s+x.vol,0)/20;return a?r.at(-1).vol/a:1}
async function candles(s,t){let u=`${BASE}/api/v2/mix/market/candles?symbol=${s}&productType=usdt-futures&granularity=${t}&limit=200`,r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(r.status);let j=await r.json();if(j.code!=='00000')throw Error(j.msg||'API');return j.data.map(x=>({ts:+x[0],open:+x[1],high:+x[2],low:+x[3],close:+x[4],vol:+x[5]})).sort((a,b)=>a.ts-b.ts)}
function ts(r){let c=r.map(x=>x.close),p=c.at(-1),e20=ema(c,20).at(-1),e50=ema(c,50).at(-1),e200=ema(c,200).at(-1),R=rsi(c),H=mh(c),A=atr(r),V=vr(r),L=0,S=0;if(p>e20&&e20>e50)L+=2;if(p<e20&&e20<e50)S+=2;if(e50>e200)L++;else if(e50<e200)S++;if(R>=52&&R<=68)L++;else if(R>=32&&R<=48)S++;if(H>0)L+=.75;else if(H<0)S+=.75;if(A>0){let d20=Math.abs(p-e20)/A,d50=Math.abs(p-e50)/A;if(e20>e50&&Math.min(d20,d50)<=.7)L+=1.25;if(e20<e50&&Math.min(d20,d50)<=.7)S+=1.25}if(V>=1.15){if(H>0)L+=.5;if(H<0)S+=.5}return{L,S,p,e20,e50,e200,R,H,A,lastOpen:r.at(-1).open,prevClose:r.at(-2).close}}
function lev(dir,r15,r1,s15,s1,p){let A=(s15.A+s1.A*.55)/2;if(!(A>0))return null;let e1,e2,e3,av,sl,t1,t2,t3,risk;if(dir==='LONG'){[e1,e2,e3]=[Math.min(p,s15.e20),Math.min(p-.35*A,s15.e50),Math.min(p-.7*A,s1.e20)].sort((a,b)=>b-a);av=.35*e1+.35*e2+.3*e3;let lo=Math.min(...r1.slice(-20).map(x=>x.low));sl=Math.min(e3-.85*A,lo-.2*s1.A);if(sl>=av)sl=av-1.15*A;risk=av-sl;t1=av+1.5*risk;t2=av+2.5*risk;t3=av+3.5*risk}else{[e1,e2,e3]=[Math.max(p,s15.e20),Math.max(p+.35*A,s15.e50),Math.max(p+.7*A,s1.e20)].sort((a,b)=>a-b);av=.35*e1+.35*e2+.3*e3;let hi=Math.max(...r1.slice(-20).map(x=>x.high));sl=Math.max(e3+.85*A,hi+.2*s1.A);if(sl<=av)sl=av+1.15*A;risk=sl-av;t1=av-1.5*risk;t2=av-2.5*risk;t3=av-3.5*risk}return{e1,e2,e3,av,sl,t1,t2,t3,rr:Math.abs(t2-av)/Math.abs(av-sl)}}
function grade(sc,a,rr,d,ds,tr){let q=d==='LONG'?'L':'S',o=d==='LONG'?'S':'L',h1=ds['1H']===q,h4=ds['4H']===q,d1=ds['1D']===o;if(sc>=5.1&&a>=3&&h1&&h4&&!d1&&rr>=2.4&&tr)return'S';if(sc>=4.4&&a>=3&&h1&&h4&&!d1&&rr>=2.1)return'A+';if(sc>=3.6&&a>=2&&h4&&rr>=1.8)return'A';if(sc>=2.8&&rr>=1.5)return'B';return'PASS'}function state(g,d,p,l,A,tr){if(g==='PASS'||!l)return'PASS';let t=.25*A,z=.1*A;if(d==='LONG'){if(p<=l.sl)return'INVALID';if(p>l.e1+t)return'WAIT PULLBACK';if(p<l.e3-z)return'DEEP / WEAK';return tr?'TRIGGERED':'ENTRY WATCH'}if(p>=l.sl)return'INVALID';if(p<l.e1-t)return'WAIT PULLBACK';if(p>l.e3+z)return'DEEP / WEAK';return tr?'TRIGGERED':'ENTRY WATCH'}
async function analyze(sym){let f={},s={};for(let t of TFS){f[t]=await candles(sym,t);s[t]=ts(f[t])}let wl=0,ws=0,tw=0,ds={};for(let t of TFS){wl+=s[t].L*W[t];ws+=s[t].S*W[t];tw+=W[t];ds[t]=s[t].L>s[t].S+.5?'L':s[t].S>s[t].L+.5?'S':'-'}let ls=wl/tw,ss=ws/tw,d=ls>=ss?'LONG':'SHORT',sc=Math.max(ls,ss),q=d==='LONG'?'L':'S',a=Object.values(ds).filter(x=>x===q).length,p=s['15m'].p,tr=d==='LONG'?(p>s['15m'].lastOpen&&p>s['15m'].prevClose&&(s['15m'].H>0||s['15m'].R>52)):(p<s['15m'].lastOpen&&p<s['15m'].prevClose&&(s['15m'].H<0||s['15m'].R<48)),l=lev(d,f['15m'],f['1H'],s['15m'],s['1H'],p),g=l?grade(sc,a,l.rr,d,ds,tr):'PASS',st=state(g,d,p,l,s['15m'].A,tr);let ac=+$('account').value||1000,rp=+$('risk').value||1,Lv=+$('lev').value||10,mm=+$('margin').value||35,rd=ac*rp/100,n=0,m=0,qty=0;if(l){let sp=Math.abs(l.av-l.sl)/l.av;n=Math.min(rd/sp,ac*mm/100*Lv);m=n/Lv;qty=n/l.av;rd=n*sp}return{sym,g,st,d,sc,p,ds,a,tr,l,rd,n,m,qty}}
function fp(x){if(x==null||!isFinite(x))return'-';if(Math.abs(x)>=1000)return x.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});if(Math.abs(x)>=100)return x.toFixed(3);if(Math.abs(x)>=1)return x.toFixed(4);if(Math.abs(x)>=.01)return x.toFixed(5);return x.toFixed(8)}function cg(g){return g==='S'?'gS':g.startsWith('A')?'gA':g==='B'?'gB':'gP'}function cs(s){return s==='TRIGGERED'?'triggered':s==='ENTRY WATCH'?'watch':s==='WAIT PULLBACK'?'wait':s.includes('WEAK')?'weak':s==='INVALID'?'invalid':'pass'}
function render(r){let k={S:5,'A+':4,A:3,B:2,PASS:1};r.sort((a,b)=>k[b.g]-k[a.g]||b.sc-a.sc);$('list').innerHTML=r.map((x,i)=>{let l=x.l,act=x.g!=='PASS'&&l;return `<div class="card" onclick="this.classList.toggle('open')"><div class="top"><div class="rank">${i+1}</div><div class="sym">${x.sym.replace('USDT','')}</div><div class="badge ${cg(x.g)}">${x.g}</div><div class="badge ${x.d==='LONG'?'L':'S'}">${x.d}</div></div><div class="state ${cs(x.st)}">${x.st}</div><div class="pr"><div class="price">${fp(x.p)}</div><div class="score">Score ${x.sc.toFixed(2)}<br>${x.ds['15m']}/${x.ds['1H']}/${x.ds['4H']}/${x.ds['1D']} · ${x.a}/4</div></div>${act?`<div class="levels"><div class="box"><span>ENTRY 1</span><b>${fp(l.e1)}</b></div><div class="box"><span>ENTRY 2</span><b>${fp(l.e2)}</b></div><div class="box"><span>ENTRY 3</span><b>${fp(l.e3)}</b></div><div class="box"><span>STOP</span><b>${fp(l.sl)}</b></div><div class="box"><span>TP1</span><b>${fp(l.t1)}</b></div><div class="box"><span>TP2</span><b>${fp(l.t2)}</b></div></div>`:''}<div class="more">${act?`Avg <b>${fp(l.av)}</b><br>TP3 <b>${fp(l.t3)}</b> · R:R <b>${l.rr.toFixed(2)}</b><br>15m trigger <b>${x.tr?'YES':'NO'}</b><br>Risk <b>$${x.rd.toFixed(2)}</b> · Margin <b>$${x.m.toFixed(2)}</b><br>Notional <b>$${x.n.toFixed(2)}</b> · Qty <b>${x.qty.toFixed(6)}</b>`:'현재 A급 이상 액션 가능한 셋업이 아닙니다.'}</div></div>`}).join('')}
async function scan(){if(busy)return;busy=true;$('scan').disabled=true;try{let r=[];for(let s of SYMS){$('apiStatus').textContent='Scanning '+s+'…';r.push(await analyze(s))}render(r);$('apiStatus').textContent='Bitget connected';$('updated').textContent=new Date().toLocaleTimeString()}catch(e){$('apiStatus').textContent='API error: '+e.message}finally{busy=false;$('scan').disabled=false}}$('scan').onclick=scan;$('auto').onclick=()=>{auto=!auto;$('auto').textContent='AUTO: '+(auto?'ON':'OFF')};setInterval(()=>{if(auto)scan()},60000);['account','risk','lev','margin'].forEach(id=>{$(id).value=localStorage.getItem(id)||$(id).value;$(id).addEventListener('change',()=>localStorage.setItem(id,$(id).value))});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});scan();
</script></body></html>
