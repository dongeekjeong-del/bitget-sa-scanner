<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>S/A Scalp Scanner v3</title><style>body{margin:0;background:#0b0d12;color:#f4f6fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:18px 12px 32px}header{position:sticky;top:0;background:rgba(11,13,18,.96);padding:8px 0 12px;z-index:5}h1{margin:0;font-size:21px}.sub,.muted{color:#9aa4b2;font-size:11px}.tabs{display:flex;gap:8px;margin:10px 0}.tab{flex:1;text-align:center;padding:10px;border-radius:10px;background:#191e2b;color:#9aa4b2;text-decoration:none;font-weight:800}.tab.on{background:#70a7ff;color:#07111f}.set{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.f{background:#131722;border:1px solid #252b3a;border-radius:10px;padding:7px}.f label{display:block;color:#9aa4b2;font-size:9px}.f input{width:100%;background:transparent;border:0;outline:0;color:#f4f6fb;font-size:14px}.acts{display:flex;gap:8px;margin-top:8px}button{flex:1;padding:11px;border:0;border-radius:11px;font-weight:800}.scan{background:#70a7ff}.auto{background:#191e2b;color:#f4f6fb;border:1px solid #252b3a}.status{display:flex;justify-content:space-between;color:#9aa4b2;font-size:11px;margin:9px 2px}.rule,.card{background:#131722;border:1px solid #252b3a;border-radius:14px;padding:12px;margin:9px 0}.top{display:flex;gap:8px;align-items:center}.sym{font-size:18px;font-weight:900;flex:1}.badge{background:#191e2b;border-radius:8px;padding:5px 8px;font-size:12px;font-weight:900}.Sg{color:#71f7b8}.Ag{color:#88b4ff}.Bg{color:#f5c15a}.Pg{color:#8b95a3}.long{color:#3ddc97}.short{color:#ff7777}.state{font-size:13px;font-weight:900;margin-top:7px}.ready{color:#3ddc97}.watch{color:#f5b942}.wait{color:#8ab4ff}.pass{color:#9aa4b2}.priceRow{display:flex;justify-content:space-between;align-items:end;margin-top:9px}.price{font-size:25px;font-weight:900}.score{text-align:right;color:#9aa4b2;font-size:11px}.roomGood{color:#71f7b8;font-weight:900}.roomBad{color:#ff7777;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.box{background:#191e2b;padding:7px;border-radius:9px;text-align:center}.box span{display:block;color:#9aa4b2;font-size:9px}.box b{font-size:12px}.more{display:none;margin-top:9px;padding-top:9px;border-top:1px solid #252b3a;font-size:12px;line-height:1.65}.card.open .more{display:block}@media(max-width:430px){.set{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><header><h1>S/A Scanner · SCALP v3</h1><div class="sub">4H/1H bias → 15m setup → 5m trigger → 구조적 ROOM ≥ 1%</div><div class="tabs"><a class="tab" href="./">SWING</a><a class="tab on" href="./scalp-v3.html">SCALP</a></div><div class="set"><div class="f"><label>Account $</label><input id="account" value="1000" type="number"></div><div class="f"><label>Risk %</label><input id="risk" value="1" step=".1" type="number"></div><div class="f"><label>Leverage</label><input id="lev" value="10" type="number"></div><div class="f"><label>Max Margin %</label><input id="mm" value="35" type="number"></div></div><div class="acts"><button id="scan" class="scan">SCAN NOW</button><button id="auto" class="auto">AUTO: ON</button></div><div class="status"><span id="st">Ready</span><span id="up">—</span></div></header><div class="rule muted">우선순위: READY/TRIGGERED → ENTRY WATCH → WAIT PULLBACK → ROOM&lt;1% → PASS. 같은 상태에서는 S → A+ → A → B, 그 다음 ROOM과 Score 순.</div><div id="list"></div></div><script>const B='https://api.bitget.com',SY=['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','PEPEUSDT','XLMUSDT'],TF=['5m','15m','1H','4H'];let busy=false,au=true;const $=x=>document.getElementById(x);function ema(v,p){let a=2/(p+1),o=[v[0]];for(let i=1;i<v.length;i++)o.push(v[i]*a+o[i-1]*(1-a));return o}function rsi(v,p=14){if(v.length<=p)return 50;let g=0,l=0;for(let i=1;i<=p;i++){let d=v[i]-v[i-1];d>=0?g+=d:l-=d}g/=p;l/=p;for(let i=p+1;i<v.length;i++){let d=v[i]-v[i-1];g=(g*(p-1)+Math.max(d,0))/p;l=(l*(p-1)+Math.max(-d,0))/p}return l===0?100:100-100/(1+g/l)}function atr(r,p=14){let t=[];for(let i=1;i<r.length;i++)t.push(Math.max(r[i].high-r[i].low,Math.abs(r[i].high-r[i-1].close),Math.abs(r[i].low-r[i-1].close)));let n=Math.min(p,t.length),a=t.slice(0,n).reduce((x,y)=>x+y,0)/n;for(let i=n;i<t.length;i++)a=(a*(p-1)+t[i])/p;return a}function hist(v){let a=ema(v,12),b=ema(v,26),m=v.map((_,i)=>a[i]-b[i]),s=ema(m,9);return m.at(-1)-s.at(-1)}async function candles(sym,tf){let u=`${B}/api/v2/mix/market/candles?symbol=${sym}&productType=usdt-futures&granularity=${tf}&limit=200`,r=await fetch(u,{cache:'no-store'}),j=await r.json();if(!r.ok||j.code!=='00000')throw Error(j.msg||r.status);return j.data.map(x=>({ts:+x[0],open:+x[1],high:+x[2],low:+x[3],close:+x[4],vol:+x[5]})).sort((a,b)=>a.ts-b.ts)}function score(r){let c=r.map(x=>x.close),p=c.at(-1),e9=ema(c,9).at(-1),e20=ema(c,20).at(-1),e50=ema(c,50).at(-1),R=rsi(c),H=hist(c),A=atr(r),L=0,S=0;if(p>e9&&e9>e20)L+=2;if(p<e9&&e9<e20)S+=2;if(e20>e50)L+=1.25;else if(e20<e50)S+=1.25;if(R>52&&R<72)L++;else if(R<48&&R>28)S++;if(H>0)L+=.75;else if(H<0)S+=.75;return{p,e9,e20,e50,R,H,A,L,S,open:r.at(-1).open,pc:r.at(-2).close}}function pivots(r,n=2){let hi=[],lo=[];for(let i=n;i<r.length-n;i++){let H=true,L=true;for(let k=1;k<=n;k++){if(r[i].high<=r[i-k].high||r[i].high<r[i+k].high)H=false;if(r[i].low>=r[i-k].low||r[i].low>r[i+k].low)L=false}if(H)hi.push(r[i].high);if(L)lo.push(r[i].low)}return{hi,lo}}function uniq(a){return[...new Set(a.map(x=>+x.toPrecision(10)))]}function targets(d,av,r15,r1,A1){let p15=pivots(r15.slice(-80)),p1=pivots(r1.slice(-80)),hi=uniq([...p15.hi,...p1.hi]),lo=uniq([...p15.lo,...p1.lo]);if(d==='LONG'){let c=hi.filter(x=>x>av*1.001).sort((a,b)=>a-b);if(!c.length)c=[av+1.5*A1,av+2.3*A1,av+3*A1];while(c.length<3)c.push(c.at(-1)+.7*A1);return{t1:c[0],t2:c[1],t3:c[2],room:(c[0]-av)/av*100}}let c=lo.filter(x=>x<av*.999).sort((a,b)=>b-a);if(!c.length)c=[av-1.5*A1,av-2.3*A1,av-3*A1];while(c.length<3)c.push(c.at(-1)-.7*A1);return{t1:c[0],t2:c[1],t3:c[2],room:(av-c[0])/av*100}}function levels(d,r5,s5,s15,r15,r1,s1,p){let A=s5.A,e1,e2,e3,av,sl;if(d==='LONG'){e1=Math.min(p,s5.e9);e2=Math.min(e1-.2*A,s5.e20);e3=Math.min(e2-.22*A,s15.e9);av=.4*e1+.35*e2+.25*e3;sl=Math.min(Math.min(...r5.slice(-18).map(x=>x.low))-.18*A,av*(1-.004))}else{e1=Math.max(p,s5.e9);e2=Math.max(e1+.2*A,s5.e20);e3=Math.max(e2+.22*A,s15.e9);av=.4*e1+.35*e2+.25*e3;sl=Math.max(Math.max(...r5.slice(-18).map(x=>x.high))+.18*A,av*(1+.004))}let t=targets(d,av,r15,r1,s1.A);return{e1,e2,e3,av,sl,t1:t.t1,t2:t.t2,t3:t.t3,room:t.room}}async function analyze(sym){let f={},s={};for(let t of TF){f[t]=await candles(sym,t);s[t]=score(f[t])}let d4=s['4H'].L>s['4H'].S?'L':'S',d1=s['1H'].L>s['1H'].S?'L':'S',d15=s['15m'].L>s['15m'].S?'L':'S',d5=s['5m'].L>s['5m'].S?'L':'S',d=(d4===d1?d1:d15)==='L'?'LONG':'SHORT',q=d==='LONG'?'L':'S',align=[d5,d15,d1,d4].filter(x=>x===q).length,bias=(d1===q?1:0)+(d4===q?1:0),raw=(s['5m'][q]+s['15m'][q]+s['1H'][q]+s['4H'][q])/4,trig=d==='LONG'?(s['5m'].p>s['5m'].open&&s['5m'].p>s['5m'].pc&&s['5m'].H>0&&s['5m'].R>52):(s['5m'].p<s['5m'].open&&s['5m'].p<s['5m'].pc&&s['5m'].H<0&&s['5m'].R<48),l=levels(d,f['5m'],s['5m'],s['15m'],f['15m'],f['1H'],s['1H'],s['5m'].p);let g='PASS';if(l.room>=1){if(bias===2&&align===4&&raw>=4.15&&trig)g='S';else if(bias===2&&align>=3&&raw>=3.65)g='A+';else if(bias>=1&&align>=3&&raw>=3.15)g='A';else if(align>=2&&raw>=2.65)g='B'}else if(align>=2&&raw>=2.65)g='B';let tol=.25*s['5m'].A,state='PASS';if(g!=='PASS'){if(l.room<1)state='ROOM < 1%';else if(d==='LONG')state=s['5m'].p>l.e1+tol?'WAIT PULLBACK':trig?'READY / TRIGGERED':'ENTRY WATCH';else state=s['5m'].p<l.e1-tol?'WAIT PULLBACK':trig?'READY / TRIGGERED':'ENTRY WATCH'}let ac=+$('account').value||1000,rp=+$('risk').value||1,lv=+$('lev').value||10,mm=+$('mm').value||35,rd=ac*rp/100,n=0,m=0,sp=Math.abs(l.av-l.sl)/l.av;if(sp>0){n=Math.min(rd/sp,ac*mm/100*lv);m=n/lv;rd=n*sp}return{sym,d,g,state,p:s['5m'].p,raw,align,dirs:[d5,d15,d1,d4],trig,l,rd,m,n}}function fp(x){if(Math.abs(x)>=1000)return x.toLocaleString(undefined,{maximumFractionDigits:2});if(Math.abs(x)>=1)return x.toFixed(4);if(Math.abs(x)>=.01)return x.toFixed(5);return x.toFixed(8)}function gc(g){return g==='S'?'Sg':g[0]==='A'?'Ag':g==='B'?'Bg':'Pg'}function ss(x){return x.startsWith('READY')?'ready':x==='ENTRY WATCH'?'watch':x==='WAIT PULLBACK'?'wait':'pass'}function statusRank(x){if(x.startsWith('READY'))return 5;if(x==='ENTRY WATCH')return 4;if(x==='WAIT PULLBACK')return 3;if(x==='ROOM < 1%')return 2;if(x==='PASS')return 1;return 0}function render(a){let gr={S:4,'A+':3,A:2,B:1,PASS:0};a.sort((x,y)=>statusRank(y.state)-statusRank(x.state)||gr[y.g]-gr[x.g]||y.l.room-x.l.room||y.raw-x.raw);$('list').innerHTML=a.map((x,i)=>`<div class="card" onclick="this.classList.toggle('open')"><div class="top"><span class="muted">${i+1}</span><div class="sym">${x.sym.replace('USDT','')}</div><span class="badge ${gc(x.g)}">${x.g}</span><span class="badge ${x.d==='LONG'?'long':'short'}">${x.d}</span></div><div class="state ${ss(x.state)}">${x.state}</div><div class="priceRow"><div class="price">${fp(x.p)}</div><div class="score">Score ${x.raw.toFixed(2)}<br>5m/15m/1H/4H ${x.dirs.join('/')}<br><span class="${x.l.room>=1?'roomGood':'roomBad'}">ROOM ${x.l.room.toFixed(2)}%</span></div></div>${x.g!=='PASS'?`<div class="grid"><div class="box"><span>ENTRY 1 · 40%</span><b>${fp(x.l.e1)}</b></div><div class="box"><span>ENTRY 2 · 35%</span><b>${fp(x.l.e2)}</b></div><div class="box"><span>ENTRY 3 · 25%</span><b>${fp(x.l.e3)}</b></div><div class="box"><span>STOP</span><b>${fp(x.l.sl)}</b></div><div class="box"><span>TP1 · STRUCTURE</span><b>${fp(x.l.t1)}</b></div><div class="box"><span>TP2 · STRUCTURE</span><b>${fp(x.l.t2)}</b></div></div>`:''}<div class="more">TP3: <b>${fp(x.l.t3)}</b><br>First structural room: <b>${x.l.room.toFixed(2)}%</b><br>5m trigger: <b>${x.trig?'YES':'NO'}</b><br>Risk at SL: <b>$${x.rd.toFixed(2)}</b> · Margin: <b>$${x.m.toFixed(2)}</b></div></div>`).join('')}async function scan(){if(busy)return;busy=true;$('scan').disabled=true;try{let a=[];for(let s of SY){$('st').textContent='Scanning '+s+'…';a.push(await analyze(s))}render(a);$('st').textContent='Bitget connected · ACTION PRIORITY';$('up').textContent=new Date().toLocaleTimeString()}catch(e){$('st').textContent='API error: '+e.message}finally{busy=false;$('scan').disabled=false}}$('scan').onclick=scan;$('auto').onclick=()=>{au=!au;$('auto').textContent='AUTO: '+(au?'ON':'OFF')};setInterval(()=>{if(au)scan()},30000);scan();</script></body></html>
