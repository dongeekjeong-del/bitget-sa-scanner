<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><meta name="apple-mobile-web-app-capable" content="yes"><title>S/A Scalp Scanner</title><style>:root{--bg:#0b0d12;--p:#131722;--p2:#191e2b;--t:#f4f6fb;--m:#9aa4b2;--l:#252b3a;--g:#3ddc97;--w:#f5b942;--r:#ff6b6b;--b:#70a7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:18px 12px 30px}header{position:sticky;top:0;z-index:9;background:rgba(11,13,18,.95);padding:8px 0 12px}h1{margin:0;font-size:21px}.sub,.mini{color:var(--m);font-size:11px}.tabs{display:flex;gap:7px;margin:10px 0}.tab{flex:1;padding:10px;text-align:center;border-radius:10px;background:var(--p2);color:var(--m);font-weight:800;text-decoration:none}.tab.on{background:var(--b);color:#07111f}.set{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.f{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:7px}.f label{display:block;color:var(--m);font-size:9px}.f input{width:100%;border:0;outline:0;background:transparent;color:var(--t);font-size:14px}.acts{display:flex;gap:7px;margin-top:8px}button{flex:1;padding:11px;border:0;border-radius:11px;font-weight:800}.scan{background:var(--b)}.auto{background:var(--p2);color:var(--t);border:1px solid var(--l)}.status{display:flex;justify-content:space-between;color:var(--m);font-size:11px;margin:9px 2px}.card{background:var(--p);border:1px solid var(--l);border-radius:15px;margin:9px 0;padding:13px}.top{display:flex;align-items:center;gap:8px}.sym{font-size:18px;font-weight:900;flex:1}.badge{font-size:12px;font-weight:900;padding:5px 8px;border-radius:8px;background:var(--p2)}.long{color:var(--g)}.short{color:#ff7777}.Sg{color:#71f7b8}.Ag{color:#88b4ff}.Bg{color:#f5c15a}.Pg{color:var(--m)}.ready{color:var(--g)}.watch{color:var(--w)}.wait{color:#8ab4ff}.pass{color:var(--m)}.state{font-size:13px;font-weight:900;margin-top:8px}.pr{display:flex;justify-content:space-between;align-items:end;margin-top:9px}.price{font-size:25px;font-weight:900}.score{text-align:right;color:var(--m);font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.box{background:var(--p2);padding:7px;border-radius:9px;text-align:center}.box span{display:block;color:var(--m);font-size:9px}.box b{font-size:12px}.more{display:none;border-top:1px solid var(--l);margin-top:9px;padding-top:9px;font-size:12px;line-height:1.65}.card.open .more{display:block}.rule{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:10px;font-size:11px;color:var(--m);line-height:1.55;margin:9px 0}@media(max-width:430px){.set{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><header><h1>S/A Scanner · SCALP</h1><div class="sub">4H/1H bias → 15m setup → 5m trigger · 목표 보유 10분~수시간</div><div class="tabs"><a class="tab" href="./">SWING</a><a class="tab on" href="./scalp.html">SCALP</a></div><div class="set"><div class="f"><label>Account $</label><input id="account" value="1000" type="number"></div><div class="f"><label>Risk %</label><input id="risk" value="1" step=".1" type="number"></div><div class="f"><label>Leverage</label><input id="lev" value="10" type="number"></div><div class="f"><label>Max Margin %</label><input id="mm" value="35" type="number"></div></div><div class="acts"><button id="scan" class="scan">SCAN NOW</button><button id="auto" class="auto">AUTO: ON</button></div><div class="status"><span id="st">Ready</span><span id="up">—</span></div></header><div class="rule">SCALP 규칙: A 이상만 우선 관찰. 4H/1H 방향을 필터로 쓰고 5m 확인으로 진입. TP1 40% · TP2 40% · TP3 20%. 5m 관점이 깨지면 장기 보유로 전환하지 않음.</div><div id="list"></div></div><script>const B='https://api.bitget.com',SY=['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','PEPEUSDT','XLMUSDT'],TF=['5m','15m','1H','4H'],W={'5m':2,'15m':3,'1H':3,'4H':2};let busy=false,au=true;const $=x=>document.getElementById(x);function ema(v,p){let a=2/(p+1),o=[v[0]];for(let i=1;i<v.length;i++)o.push(v[i]*a+o[i-1]*(1-a));return o}function rsi(v,p=14){let g=0,l=0;if(v.length<=p)return 50;for(let i=1;i<=p;i++){let d=v[i]-v[i-1];d>=0?g+=d:l-=d}g/=p;l/=p;for(let i=p+1;i<v.length;i++){let d=v[i]-v[i-1];g=(g*(p-1)+Math.max(d,0))/p;l=(l*(p-1)+Math.max(-d,0))/p}return l===0?100:100-100/(1+g/l)}function atr(r,p=14){let t=[];for(let i=1;i<r.length;i++)t.push(Math.max(r[i].high-r[i].low,Math.abs(r[i].high-r[i-1].close),Math.abs(r[i].low-r[i-1].close)));let n=Math.min(p,t.length),a=t.slice(0,n).reduce((x,y)=>x+y,0)/n;for(let i=n;i<t.length;i++)a=(a*(p-1)+t[i])/p;return a}function hist(v){let a=ema(v,12),b=ema(v,26),m=v.map((_,i)=>a[i]-b[i]),s=ema(m,9);return m.at(-1)-s.at(-1)}async function c(sym,tf){let u=`${B}/api/v2/mix/market/candles?symbol=${sym}&productType=usdt-futures&granularity=${tf}&limit=200`,r=await fetch(u,{cache:'no-store'}),j=await r.json();if(!r.ok||j.code!=='00000')throw Error(j.msg||r.status);return j.data.map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5]})).sort((a,b)=>a.t-b.t).map(x=>({ts:x.t,open:x.o,high:x.h,low:x.l,close:x.c,vol:x.v}))}function sc(r){let v=r.map(x=>x.close),p=v.at(-1),e9=ema(v,9).at(-1),e20=ema(v,20).at(-1),e50=ema(v,50).at(-1),R=rsi(v),H=hist(v),A=atr(r),L=0,S=0;if(p>e9&&e9>e20)L+=2;if(p<e9&&e9<e20)S+=2;if(e20>e50)L+=1.25;else if(e20<e50)S+=1.25;if(R>52&&R<72)L+=1;else if(R<48&&R>28)S+=1;if(H>0)L+=.75;else if(H<0)S+=.75;return{p,e9,e20,e50,R,H,A,L,S,open:r.at(-1).open,pc:r.at(-2).close}}function lvl(d,r5,s5,s15,p){let A=s5.A;if(!(A>0))return null;let e1,e2,e3,av,sl,risk;if(d==='LONG'){e1=Math.min(p,s5.e9);e2=Math.min(e1-.15*A,s5.e20);e3=Math.min(e2-.18*A,s15.e9);av=.4*e1+.35*e2+.25*e3;let lo=Math.min(...r5.slice(-12).map(x=>x.low));sl=Math.min(e3-.45*A,lo-.12*A);if(sl>=av)sl=av-.8*A;risk=av-sl;return{e1,e2,e3,av,sl,t1:av+.8*risk,t2:av+1.35*risk,t3:av+2*risk}}e1=Math.max(p,s5.e9);e2=Math.max(e1+.15*A,s5.e20);e3=Math.max(e2+.18*A,s15.e9);av=.4*e1+.35*e2+.25*e3;let hi=Math.max(...r5.slice(-12).map(x=>x.high));sl=Math.max(e3+.45*A,hi+.12*A);if(sl<=av)sl=av+.8*A;risk=sl-av;return{e1,e2,e3,av,sl,t1:av-.8*risk,t2:av-1.35*risk,t3:av-2*risk}}async function an(sym){let f={},s={};for(let t of TF){f[t]=await c(sym,t);s[t]=sc(f[t])}let d4=s['4H'].L>s['4H'].S?'L':'S',d1=s['1H'].L>s['1H'].S?'L':'S',d15=s['15m'].L>s['15m'].S?'L':'S',d5=s['5m'].L>s['5m'].S?'L':'S',d=(d4===d1?d1:d15)==='L'?'LONG':'SHORT',q=d==='LONG'?'L':'S';let align=[d5,d15,d1,d4].filter(x=>x===q).length,bias=(d1===q?1:0)+(d4===q?1:0),raw=(s['5m'][q]+s['15m'][q]+s['1H'][q]+s['4H'][q])/4;let trig=d==='LONG'?(s['5m'].p>s['5m'].open&&s['5m'].p>s['5m'].pc&&s['5m'].H>0&&s['5m'].R>52):(s['5m'].p<s['5m'].open&&s['5m'].p<s['5m'].pc&&s['5m'].H<0&&s['5m'].R<48);let g='PASS';if(bias===2&&align===4&&raw>=4.15&&trig)g='S';else if(bias===2&&align>=3&&raw>=3.65)g='A+';else if(bias>=1&&align>=3&&raw>=3.15)g='A';else if(align>=2&&raw>=2.65)g='B';let l=lvl(d,f['5m'],s['5m'],s['15m'],s['5m'].p),tol=.2*s['5m'].A,state='PASS';if(g!=='PASS'){if(d==='LONG'){state=s['5m'].p>l.e1+tol?'WAIT PULLBACK':trig?'READY / TRIGGERED':'ENTRY WATCH'}else state=s['5m'].p<l.e1-tol?'WAIT PULLBACK':trig?'READY / TRIGGERED':'ENTRY WATCH'}let ac=+$('account').value||1000,rp=+$('risk').value||1,lv=+$('lev').value||10,mm=+$('mm').value||35,rd=ac*rp/100,n=0,m=0;if(l){let sp=Math.abs(l.av-l.sl)/l.av;n=Math.min(rd/sp,ac*mm/100*lv);m=n/lv;rd=n*sp}return{sym,d,g,state,p:s['5m'].p,raw,align,dirs:[d5,d15,d1,d4],trig,l,rd,m,n}}function fp(x){if(Math.abs(x)>=1000)return x.toLocaleString(undefined,{maximumFractionDigits:2});if(Math.abs(x)>=1)return x.toFixed(4);if(Math.abs(x)>=.01)return x.toFixed(5);return x.toFixed(8)}function gc(g){return g==='S'?'Sg':g[0]==='A'?'Ag':g==='B'?'Bg':'Pg'}function ss(x){return x.startsWith('READY')?'ready':x==='ENTRY WATCH'?'watch':x==='WAIT PULLBACK'?'wait':'pass'}function render(a){let rk={S:5,'A+':4,A:3,B:2,PASS:1};a.sort((x,y)=>rk[y.g]-rk[x.g]||y.raw-x.raw);$('list').innerHTML=a.map((x,i)=>`<div class="card" onclick="this.classList.toggle('open')"><div class="top"><span class="mini">${i+1}</span><div class="sym">${x.sym.replace('USDT','')}</div><span class="badge ${gc(x.g)}">${x.g}</span><span class="badge ${x.d==='LONG'?'long':'short'}">${x.d}</span></div><div class="state ${ss(x.state)}">${x.state}</div><div class="pr"><div class="price">${fp(x.p)}</div><div class="score">Score ${x.raw.toFixed(2)}<br>5m/15m/1H/4H ${x.dirs.join('/')}</div></div>${x.g!=='PASS'?`<div class="grid"><div class="box"><span>ENTRY 1 · 40%</span><b>${fp(x.l.e1)}</b></div><div class="box"><span>ENTRY 2 · 35%</span><b>${fp(x.l.e2)}</b></div><div class="box"><span>ENTRY 3 · 25%</span><b>${fp(x.l.e3)}</b></div><div class="box"><span>STOP</span><b>${fp(x.l.sl)}</b></div><div class="box"><span>TP1 · 40%</span><b>${fp(x.l.t1)}</b></div><div class="box"><span>TP2 · 40%</span><b>${fp(x.l.t2)}</b></div></div>`:''}<div class="more">${x.g!=='PASS'?`TP3 · 20%: <b>${fp(x.l.t3)}</b><br>5m trigger: <b>${x.trig?'YES':'NO'}</b><br>Risk at SL: <b>$${x.rd.toFixed(2)}</b> · Margin: <b>$${x.m.toFixed(2)}</b><br><b>Time stop:</b> 5m 구조가 무너지거나 60~90분 내 follow-through가 없으면 재평가. 스캘프를 스윙으로 전환하지 않기.`:'No actionable scalp setup.'}</div></div>`).join('')}async function scan(){if(busy)return;busy=true;$('scan').disabled=true;try{let a=[];for(let s of SY){$('st').textContent='Scanning '+s+'…';a.push(await an(s))}render(a);$('st').textContent='Bitget connected · SCALP';$('up').textContent=new Date().toLocaleTimeString()}catch(e){$('st').textContent='API error: '+e.message}finally{busy=false;$('scan').disabled=false}}$('scan').onclick=scan;$('auto').onclick=()=>{au=!au;$('auto').textContent='AUTO: '+(au?'ON':'OFF')};setInterval(()=>{if(au)scan()},30000);scan();</script></body></html>
